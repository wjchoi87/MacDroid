name: MacDroid
options:
  bundleIdPrefix: kr.macdroid
  # 소스 문자열은 한국어, 번역은 App/Resources/Localizable.xcstrings(영어)
  developmentLanguage: ko
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # 변경 전: 자체 서명(MacDroid Development) + Hardened Runtime OFF — Gatekeeper 경고 우회용.
    # 변경 후: Developer ID Application(4N5S7KDZ56) + Hardened Runtime ON — Apple 공증(notarytool) 필수 조건.
    # 이유: 대장님 요청으로 배포 빌드를 공증 가능한 정식 서명으로 전환.
    # 영향: MacDroid/macdroid 모두 재빌드 시 적용. 로컬 네트워크 TCC 권한은 Team ID 기반으로 유지된다.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    DEVELOPMENT_TEAM: 4N5S7KDZ56
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: "YES"
    DEAD_CODE_STRIPPING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
targets:
  MacDroid:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: MacDroid
        CFBundleName: MacDroid
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        CFBundleIconFile: AppIcon
        ITSAppUsesNonExemptEncryption: false
        # 로컬 네트워크 권한: 앱 소속 adb server가 LAN mDNS/unicast를 쓰려면 필수
        # (없으면 macOS가 조용히 차단 — 자동발견 빈 목록 + "No route to host" 실측)
        NSLocalNetworkUsageDescription: "같은 Wi-Fi에 있는 Android 기기를 찾아 무선으로 연결하기 위해 로컬 네트워크 접근이 필요합니다."
        NSBonjourServices:
          - _adb-tls-connect._tcp
          - _adb-tls-pairing._tcp
          - _adb._tcp
    postBuildScripts:
      - name: Install Vendor Binaries
        script: |
          "$PROJECT_DIR/scripts/install-vendor.sh" "$BUILT_PRODUCTS_DIR/$WRAPPER_NAME" "$PROJECT_DIR"

  # 에이전트/스크립트용 CLI — GUI Core(ADB/Scrcpy/AppCatalog)를 그대로 공유한다.
  macdroid:
    type: tool
    platform: macOS
    sources:
      - path: App/Sources/Core
      - path: App/Sources/Models
      - path: App/Sources/Support/Binaries.swift
      - path: App/Sources/Support/ProcessRunner.swift
      - path: CLI/Sources
    settings:
      base:
        PRODUCT_NAME: macdroid
        PRODUCT_BUNDLE_IDENTIFIER: kr.macdroid.cli
    postBuildScripts:
      # 실행 파일 옆에 bin/lib/share를 깔아 Binaries가 그대로 해석하게 한다.
      - name: Install Vendor Binaries (CLI)
        script: |
          "$PROJECT_DIR/scripts/install-vendor.sh" "$TARGET_BUILD_DIR" "$PROJECT_DIR"
    scheme:
      testTargets: []
